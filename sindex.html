                    <h1>Data Mining Functionalities & Techniques</h1>
                    <p>What exactly can data mining <em>do</em>? There are major functionalities that describe what kind of patterns can be mined from data.</p>

                    <h2>A. Concept / Class Description (Definition)</h2>
                    <p>Data is always associated with classes or concepts. All classes or concepts need descriptions, which can be done in two ways:</p>
                    <ul>
                        <li><strong>Data Characterization:</strong> Refers to the summary of the class or concept being studied or mined. It provides a general overview. <em>Example: What does a typical "A" student look like? (High attendance, uses library regularly).</em></li>
                        <li><strong>Data Discrimination:</strong> Compares the common features of two or more classes or concepts. It looks at the differences between them using bar charts, curves, or graphs. <em>Example: What is the difference between students who Pass vs. Fail?</em></li>
                    </ul>

                    <div class="example-box">
                        <h3>Characterization vs Discrimination in Practice</h3>
                        <p><strong>Characterization</strong> answers "What is normal for this group?" — e.g., the average attendance of passing students is 84%, and their average assignment mark is 80%.</p>
                        <p><strong>Discrimination</strong> answers "How do these two groups differ?" — e.g., passing students attend 84% on average, failing students attend only 42% on average. The <em>gap</em> is the discriminated feature.</p>
                    </div>

                    <h2>B. Mining Frequent Patterns, Associations, and Correlations</h2>
                    <p>Frequent patterns are things found most commonly in data (happening more times). This includes frequent itemsets, frequent subsequences, and frequent substructures.</p>
                    <ul>
                        <li><strong>Association Analysis:</strong> A way of identifying the relationship between various items (how data are related to each other). <em>Example: Used to determine the sales of items that are frequently purchased together. (Dry fruit is frequently purchased; Dry fruit + Chocolate are purchased together).</em></li>
                        <li><strong>Correlation Analysis:</strong> A mathematical technique that shows how strongly a pair of attributes are related together. <em>Example: Tall people tend to have more weight (Tall = Attribute 1, Weight = Attribute 2).</em></li>

                    <h2>2. Standardization (Z-score)</h2>
                    <p>This transforms data so the mean is 0 and the standard deviation is 1. This is mathematically superior for algorithms that rely on distance (like K-Means and KNN) because it handles outliers better than Min-Max scaling.</p>

                        x = the individual value being converted<br>
                        &mu; (mu) = the mean (average) of the whole column<br>
                        &sigma; (sigma) = the standard deviation of the whole column<br>
                        z = how many standard deviations x sits away from the mean
                    </div>

                        <li><strong>z = -1</strong> → the value is one typical step below the average.</li>
                        <li><strong>z = +2 or more</strong> → the value is unusually high (about the top 2.5% of a normal distribution).</li>
                        <li><strong>z = -2 or less</strong> → the value is unusually low.</li>

                    <h2>3. Encoding Categorical Data</h2>
                    <p>Python algorithms cannot do math on words like "Pass" or "Male". They need numbers.</p>
                    <ul>
                        <li><strong>Label Encoding:</strong> Assigns a number to each category (e.g., Pass=1, Fail=0). A number assigned to a category does not necessarily mean that the category is higher or lower than another.</li>
                        <li><strong>One-Hot Encoding:</strong> Creates separate 0/1 columns for each category (e.g., a column for "Male" and a column for "Female" filled with 0s and 1s).</li>
                    </ul>

                    <p>The problem with assigning numbers to colours is that numbers carry hidden mathematics. If you label encode Red=0, Green=1, Blue=2, then a model may believe Blue is "twice" Green, or that Blue &gt; Red. For a <strong>nominal</strong> category (no natural order), that is false information that the algorithm will happily use.</p>
                    <p><strong>One-hot encoding</strong> solves this by creating one new 0/1 column per category. Every row has exactly one 1 (the category it belongs to) and 0 everywhere else. No category is "bigger" than another because they are all separate yes/no questions.</p>

                        <p>If you keep all three colour columns, then <code>Color_Red = 1 - Color_Blue - Color_Green</code>. One column is a perfect linear combination of the others. This is called <strong>multicollinearity</strong>, and it breaks regression models (the model cannot uniquely solve for coefficients). The fix is <code>drop_first=True</code>, which removes one column — the "reference" or "baseline" category. When all remaining flags are 0, the model infers the dropped category. The information is preserved, but no column is redundant.</p>

                    <table>

                            <td>1 (same column, now numeric)</td>

                        <tr>

                            <td>Yes — model may treat 2 as "twice" 1</td>
                            <td>No — every category is equidistant</td>
                        </tr>
                        <tr>
                            <td>Use for</td>
                            <td><strong>Ordinal</strong> data (Low=0, Med=1, High=2) or tree-based models</td>
                            <td><strong>Nominal</strong> data (Red, Green, Blue; Male, Female)</td>
                        </tr>
                        <tr>
                            <td>Risk</td>
                            <td>Fake ordering misleads the model</td>
                            <td>Many new columns if the category has many values (curse of dimensionality)</td>
                        </tr>

                            <td><code>df["c"].astype("category").cat.codes</code></td>

                    <h2>4. Aggregation and Data Reduction</h2>
                    <p>Aggregation combines detailed records into summaries (e.g., daily sales summed by month). Data reduction decreases the volume of data while retaining useful information (e.g., selecting relevant attributes, sampling).</p>

                    <h2>Deep Dive: Aggregation and Data Reduction Explained Fully</h2>
                    <p>Imagine a supermarket that records every single item sold, second by second. That is millions of records per day. Before you can find a pattern like "weekend sales are higher", you do not need every receipt — you need a <strong>summary per day</strong>. That is aggregation: collapsing many rows into fewer, information-rich rows by applying a <strong>summary function</strong> (sum, mean, count, min, max).</p>

                        Reduction ratio = K / N (smaller means more reduction)

                    <h2>Data Reduction Techniques at a Glance</h2>

                    <h2>Deep Dive: Median (The Middle Value)</h2>

                    <h1>Evaluating Classification Models</h1>
                    <p>How do we know if our model is actually good, or just lucky? A model may produce predictions, but we need to measure how often and in what ways it is wrong.</p>

                    <h2>The Confusion Matrix</h2>
                    <p>A table that compares what the model predicted vs. what actually happened.</p>
                    
                    <div class="visual-box">
                        <h3>Confusion Matrix Layout</h3>
                        <table style="width: 80%; margin: 0 auto; text-align: center;">
                            <tr>
                                <th></th>
                                <th>Actual: PASS</th>
                                <th>Actual: FAIL</th>
                            </tr>
                            <tr>
                                <th>Predicted: PASS</th>
                                <td style="background-color:#dcfce7; padding: 15px;"><strong>True Positive (TP)</strong><br>Correctly predicted pass</td>
                                <td style="background-color:#fee2e2; padding: 15px;"><strong>False Positive (FP)</strong><br>Type I Error</td>
                            </tr>
                            <tr>
                                <th>Predicted: FAIL</th>
                                <td style="background-color:#fee2e2; padding: 15px;"><strong>False Negative (FN)</strong><br>Type II Error</td>
                                <td style="background-color:#dcfce7; padding: 15px;"><strong>True Negative (TN)</strong><br>Correctly predicted fail</td>
                            </tr>
                        </table>
                    </div>

                    <h2>Evaluation Formulas</h2>
                    <div class="formula-box">
                        Accuracy = (TP + TN) / (TP + TN + FP + FN)<br><br>
                        Precision = TP / (TP + FP) (Of the records predicted positive, how many really were positive?)<br><br>
                        Recall = TP / (TP + FN) (Of all truly positive records, how many did the model find?)<br><br>
                        F1-Score = 2 * (Precision * Recall) / (Precision + Recall)
                    </div>

                    <div class="solution-box">

                            <li>FP = 5 (Model said Pass, they failed)</li>
                            <li>FN = 10 (Model said Fail, they passed)</li>

                        <p><strong>Accuracy:</strong> (40+45) / 100 = <strong>85%</strong></p>
                        <p><strong>Precision:</strong> 40 / (40+5) = 40/45 = <strong>88.9%</strong></p>
                        <p><strong>Recall:</strong> 40 / (40+10) = 40/50 = <strong>80%</strong></p>
                        <p><em>Note: In screening (like identifying students who need support), missing a person who needs support (False Negative) may be more serious than making an extra referral (False Positive). Therefore, we might prioritize Recall over Accuracy.</em></p>

                    <h2>Quick Formula Reference</h2>
                    <div class="formula-box">
                        <strong>1. Mean:</strong> &Sigma;x / n<br><br>
                        <strong>2. Min-Max Normalization:</strong> (x - min) / (max - min)<br><br>
                        <strong>3. Z-Score Standardization:</strong> (x - mean) / standard deviation<br><br>
                        <strong>4. Accuracy:</strong> (TP + TN) / Total Predictions<br><br>
                        <strong>5. Precision:</strong> TP / (TP + FP)<br><br>
                        <strong>6. Recall:</strong> TP / (TP + FN)<br><br>
                        <strong>7. Support (Association):</strong> (Transactions with A & B) / Total Transactions<br><br>
                        <strong>8. Confidence (A -> B):</strong> Support(A & B) / Support(A)<br><br>
                        <strong>9. Lift (A -> B):</strong> Confidence(A -> B) / Support(B)<br><br>
                        <strong>10. Linear Regression:</strong> y = mx + c<br><br>
                        <strong>11. Median (odd n):</strong> value at position (n+1)/2 in the sorted list<br><br>
                        <strong>12. Median (even n):</strong> average of values at positions n/2 and n/2 + 1<br><br>
                        <strong>13. Interquartile Range:</strong> IQR = Q3 - Q1<br><br>
                        <strong>14. Aggregation ratio:</strong> number of rows after groupby / number of rows before
                    </div>
                `
            }
        };

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            const menu = document.getElementById('menu');
            
            // Generate Menu
            Object.keys(modules).forEach(key => {
                const li = document.createElement('li');
                li.textContent = modules[key].title;
                li.id = `menu-item-${key}`;
                li.onclick = () => loadModule(key);
                menu.appendChild(li);
            });

            // Load First Module
            loadModule(1);
        });

        // Load Module Function
        function loadModule(id) {
            const menuItems = document.querySelectorAll('.menu li');
            menuItems.forEach(item => item.classList.remove('active'));
            document.getElementById(`menu-item-${id}`).classList.add('active');

            const contentDiv = document.getElementById('content');
            // Add fade-in animation
            contentDiv.style.opacity = '0';
            setTimeout(() => {
                contentDiv.innerHTML = modules[id].content;
                contentDiv.style.opacity = '1';
                contentDiv.style.transition = 'opacity 0.3s ease';
            }, 100);

            // Scroll to top
            document.querySelector('.main-content').scrollTop = 0;
        }

        // Copy Code to Clipboard Function
        function copyCode(btn) {
            const pre = btn.parentElement.nextElementSibling;
            const text = pre.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                btn.style.backgroundColor = '#10b981';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.style.backgroundColor = '#3b82f6';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
