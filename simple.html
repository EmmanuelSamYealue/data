                content: `
                    <h1>Introduction to Data Mining</h1>
                    <p><strong>Data Mining</strong> is defined as the procedure of extracting useful information, patterns, and knowledge from massive sets of raw data. Think of it as a gold miner sifting through tons of dirt to find tiny, valuable nuggets of gold. It is also defined as "mining knowledge from data" (like mining gold or coal).</p>
                    
                    <div class="example-box">
                        <h3>Everyday Example</h3>
                        <p>There are a lot of YouTube videos on the internet or a lot of colleges in BCU. Data mining is the process of searching and extracting only the specified, useful one that you actually want to watch or attend.</p>
                    </div>

                    <div class="box" style="border-left-color:#2563eb; background:#eff6ff;">
                        <h3>Beginner's Simple Explanation</h3>
                        <p>Imagine you have a giant box of Lego pieces mixed together. Data Mining is the process of dumping that box on the floor, sorting the pieces by color and size, and realizing you have enough red bricks to build a house. You didn't create new Legos; you just discovered a valuable pattern in the mess.</p>
                    </div>

                    <h2>Data, Information, Knowledge, and Pattern</h2>
                    <p>These four terms are often confused. Understanding the difference is the foundation of data mining.</p>

                    <div class="visual-box">
                        <h3>Data -> Information -> Knowledge -> Pattern</h3>
                        <svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

                                </marker>
                            </defs>
                            <circle cx="100" cy="50" r="35" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
                            <text x="100" y="55" font-size="14" text-anchor="middle" font-weight="bold">Data</text>
                            <text x="100" y="105" font-size="12" text-anchor="middle">45, 72, 80, 38, 65</text>
                            
                            <path d="M 150 50 L 190 50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
                            <text x="170" y="40" font-size="12" text-anchor="middle">Process</text>

                            <circle cx="240" cy="50" r="35" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
                            <text x="240" y="55" font-size="14" text-anchor="middle" font-weight="bold">Information</text>
                            <text x="240" y="105" font-size="12" text-anchor="middle">Average = 60</text>

                            <path d="M 290 50 L 330 50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

                            <path d="M 430 50 L 470 50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
                            <text x="450" y="40" font-size="12" text-anchor="middle">Observe</text>

                            <circle cx="530" cy="50" r="35" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
                            <text x="530" y="55" font-size="14" text-anchor="middle" font-weight="bold">Pattern</text>
                            <text x="530" y="105" font-size="12" text-anchor="middle">Repeated relationship</text>

                            <text x="100" y="160" font-size="12" text-anchor="middle">Raw Facts</text>
                            <text x="240" y="160" font-size="12" text-anchor="middle">Contextualized Data</text>
                            <text x="380" y="160" font-size="12" text-anchor="middle">Actionable Insight</text>
                            <text x="530" y="160" font-size="12" text-anchor="middle">Useful Discovery</text>
                        </svg>
                        <div class="diagram-caption">Data is raw. Information is processed. Knowledge is actionable. A pattern is a recurring relationship.</div>
                    </div>

                    <ul>
                        <li><strong>Data:</strong> Raw, unorganized facts. <em>(e.g., The numbers 45, 72, 80, 38, 65)</em>.</li>
                        <li><strong>Information:</strong> Data that has been organized and given context. <em>(e.g., "The average exam score is 60")</em>.</li>
                        <li><strong>Knowledge:</strong> Actionable insights derived from information. <em>(e.g., "Students with high attendance tend to score above 60, so we should create an attendance support program.")</em></li>
                        <li><strong>Pattern:</strong> A repeated or consistent relationship found in the data. For example, noticing that every time a customer buys diapers, they also buy beer. A pattern is the "shape" of the data.</li>
                    </ul>

                    <div class="example-box" style="border-left-color:#ca8a04; background:#fefce8;">
                        <h3>Step-by-Step Detailed Example (The Weather)</h3>
                        <p>Let's look at a weather example to see how data transforms:</p>
                        <ol>
                            <li><strong>Data:</strong> You write down the temperature every day: <code>25°C, 28°C, 30°C, 22°C</code>. These are just numbers.</li>
                            <li><strong>Information:</strong> You group them by month. "The average temperature in July was 28°C." Now it means something.</li>
                            <li><strong>Knowledge:</strong> You look at the information and realize, "July is usually the hottest month, so we should buy more air conditioners in June." You have turned information into an action.</li>
                            <li><strong>Pattern:</strong> You look at 50 years of data and notice that "Every time the temperature hits 30°C for 3 days in a row, it rains on the 4th day." This is a repeating pattern.</li>
                        </ol>
                    </div>

                    <h2>The KDD Process (Knowledge Discovery in Databases)</h2>
                    <p>Data mining is just <strong>one step</strong> in a much larger pipeline called KDD. You cannot just throw raw data into an algorithm; it must be prepared. The process of turning raw data into useful knowledge follows a sequence: Understand the problem, Select relevant data, Clean the data, Transform it, Apply a mining method, Evaluate, and Communicate findings.</p>

                    <div class="visual-box">

                        <svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">

                            <rect x="140" y="70" width="100" height="60" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
                            <text x="190" y="95" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold">2. Select</text>
                            <text x="190" y="110" font-size="12" text-anchor="middle" fill="#1e293b">Data</text>

                            <rect x="270" y="70" width="100" height="60" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
                            <text x="320" y="95" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold">3. Clean</text>
                            <text x="320" y="110" font-size="12" text-anchor="middle" fill="#1e293b">Data</text>

                            <rect x="400" y="70" width="100" height="60" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
                            <text x="450" y="95" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold">4. Transform</text>

                            <rect x="530" y="70" width="100" height="60" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
                            <text x="580" y="95" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold">5. DATA</text>
                            <text x="580" y="110" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="bold">MINING</text>

                            <text x="720" y="110" font-size="12" text-anchor="middle" fill="#1e293b">& Communicate</text>

                            <line x1="110" y1="100" x2="130" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

                        <div class="diagram-caption">Steps 1–4 usually take far longer than step 5. Preparing data is the biggest part of real projects.</div>

                `

            2: {
                title: "2. Types of Data Mined",
                content: `
                    <h1>Types of Data Mined (Data Mining Activities)</h1>
                    <p>Data isn't just numbers in a spreadsheet. It comes in various structures, and we need different tools to mine them. There are three (3) main types of data that can be mined: <strong>Database Data</strong>, <strong>Data Warehouse Data</strong>, and <strong>Transactional Data</strong>.</p>

                    <div class="box" style="border-left-color:#2563eb; background:#eff6ff;">
                        <h3>Beginner's Simple Explanation</h3>
                        <p>Think of data like food. <strong>Database Data</strong> is like a neatly organized bento box (everything has its own compartment). <strong>Data Warehouse Data</strong> is like a massive buffet (you can look at it from different angles, like by cuisine or by meal time). <strong>Transactional Data</strong> is like a shopping receipt (a list of things bought at the same time).</p>
                    </div>

                    <h2>1. Database Data (Relational RDBMS)</h2>
                    <p>Data stored in relational database management systems (RDBMS). It is a set of tables with rows (tuples/records) and columns (attributes). It is highly structured.</p>
                    
                    <div class="example-box">
                        <h3>Mining Databases</h3>
                        <p>While mining databases, we search for <strong>trends</strong> (increasing, decreasing, or neutral) or <strong>data patterns</strong> (max, min).</p>
                        <p><strong>Example:</strong> Suppose you have a list of marks for students. To observe the pattern, you check the maximum marks scored and how many students scored them, and the minimum marks scored and how many students scored them. This is done using a database.</p>
                    </div>
                    
                    <div class="visual-box">
                        <h3>Relational Database Structure</h3>
                        <svg viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
                            <rect x="10" y="10" width="480" height="30" fill="#e2e8f0" stroke="#64748b"/>
                            <text x="60" y="30" font-size="14" font-weight="bold">Student ID (Tuple)</text>
                            <text x="160" y="30" font-size="14" font-weight="bold">Name (Attribute)</text>
                            <text x="260" y="30" font-size="14" font-weight="bold">Major (Attribute)</text>
                            <text x="360" y="30" font-size="14" font-weight="bold">GPA (Attribute)</text>
                            
                            <rect x="10" y="40" width="480" height="30" fill="#fff" stroke="#cbd5e1"/>
                            <text x="60" y="60" font-size="14">001</text>
                            <text x="160" y="60" font-size="14">John</text>
                            <text x="260" y="60" font-size="14">CS</text>
                            <text x="360" y="60" font-size="14">3.8</text>

                            <rect x="10" y="70" width="480" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
                            <text x="60" y="90" font-size="14">002</text>
                            <text x="160" y="90" font-size="14">Mary</text>
                            <text x="260" y="90" font-size="14">IT</text>
                            <text x="360" y="90" font-size="14">3.5</text>
                        </svg>
                        <div class="diagram-caption">A Relational Table: Rows are records (individuals), Columns are attributes (features).</div>
                    </div>

                    <h2>2. Data Warehouse Data (Data Cube)</h2>
                    <p>A massive collection of data integrated from different sources with querying and decision-making capabilities. You can perform querying (insert, create, delete) and decision making (increasing or decreasing price by discount).</p>
                    <p>In a database, data is stored in tables. In a data warehouse, data is stored in a multidimensional structure called a <strong>Data Cube</strong>. In a database, columns are represented as attributes, but in a data warehouse, each dimension of the cube represents an attribute.</p>

                    <div class="visual-box">
                        <h3>Data Cube Visualization</h3>
                        <svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="100,80 200,30 300,80 200,130" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
                            <polygon points="100,80 200,130 200,230 100,180" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
                            <polygon points="200,130 300,80 300,180 200,230" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
                            
                            <text x="200" y="20" font-size="12" text-anchor="middle" font-weight="bold">Time (Year)</text>
                            <text x="70" y="150" font-size="12" text-anchor="middle" transform="rotate(-90 70,150)">Location</text>
                            <text x="320" y="150" font-size="12" text-anchor="middle" transform="rotate(90 320,150)">Item Types</text>
                            
                            <text x="200" y="140" font-size="14" text-anchor="middle" font-weight="bold">500</text>
                            <text x="200" y="160" font-size="10" text-anchor="middle">Sales</text>
                        </svg>
                        <div class="diagram-caption">A Data Cube: Each dimension (Time, Location, Product) is an attribute. The intersection holds the measure (e.g., Sales of Pencil, Pen).</div>
                    </div>

                    <h2>3. Transactional Data</h2>
                    <p>Each record is called a <strong>transaction</strong>. Examples include customer sales, flight bookings, and user clicks on a web page. A transaction has a transaction ID and a list of items making the transaction.</p>
                    
                    <div class="visual-box">
                        <h3>Transactional Data (Basket Format)</h3>
                        <svg viewBox="0 0 620 210" xmlns="http://www.w3.org/2000/svg">
                            <text x="310" y="18" font-size="13" font-weight="bold" text-anchor="middle">Each row is one transaction (one receipt)</text>

                            <text x="330" y="49" font-size="12" text-anchor="middle" font-weight="bold">Items Bought</text>

                            <rect x="20" y="58" width="580" height="28" fill="#ffffff" stroke="#cbd5e1"/>
                            <text x="70" y="77" font-size="12" text-anchor="middle">T1</text>
                            <text x="330" y="77" font-size="12" text-anchor="middle">Bread, Milk</text>

                            <rect x="20" y="86" width="580" height="28" fill="#f8fafc" stroke="#cbd5e1"/>
                            <text x="70" y="105" font-size="12" text-anchor="middle">T2</text>
                            <text x="330" y="105" font-size="12" text-anchor="middle">Bread, Diapers, Beer, Eggs</text>

                            <rect x="20" y="114" width="580" height="28" fill="#ffffff" stroke="#cbd5e1"/>
                            <text x="70" y="133" font-size="12" text-anchor="middle">T3</text>
                            <text x="330" y="133" font-size="12" text-anchor="middle">Milk, Diapers, Beer, Cola</text>
                        </svg>
                        <div class="diagram-caption">Transactional data is "wide" (one row, many items) rather than "tall" (one row, one item).</div>
                    </div>

                    <div class="example-box" style="border-left-color:#ca8a04; background:#fefce8;">
                        <h3>Step-by-Step Detailed Example (The Supermarket)</h3>
                        <p>Imagine you are managing a supermarket.</p>
                        <ul>
                            <li><strong>Database Data:</strong> You have an inventory table. <code>Item: Apples, Price: $2, Stock: 50</code>. You use this to know what to reorder.</li>
                            <li><strong>Data Warehouse Data:</strong> You combine data from 10 different stores across the country. You look at a "Cube" to see: <em>Total Sales of Apples in the North Region during Winter</em>. This helps you plan seasonal promotions.</li>
                            <li><strong>Transactional Data:</strong> You look at a single receipt. <code>Receipt #101: Bread, Butter, Jam</code>. By mining millions of these receipts, you might discover that people who buy Bread almost always buy Butter (this is called Association Rule Mining).</li>
                        </ul>
                    </div>
                `
            },
            3: {
                title: "3. Data Mining Functionalities",
                content: `
                    <h1>Data Mining Functionalities & Techniques</h1>
                    <p>What exactly can data mining <em>do</em>? There are major functionalities that describe what kind of patterns can be mined from data.</p>

                    <div class="box" style="border-left-color:#2563eb; background:#eff6ff;">
                        <h3>Beginner's Simple Explanation</h3>
                        <p>Think of data mining functionalities as different "tools" in a toolbox. If you want to know what a typical student looks like, you use <strong>Characterization</strong>. If you want to spot a fake bank transaction, you use <strong>Anomaly Detection</strong>. If you want to group customers, you use <strong>Clustering</strong>.</p>

                    <div class="box">
                        <strong>Simple Definition:</strong> A single row in a database table. It represents one complete item or observation.
                        <br><br>
                        <strong>Example:</strong> In a student table, one tuple is <code>(001, John, CS, 3.8)</code>.
                    </div>
                    <div class="visual-box">
                        <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">

                    <h2>3. Intraclass vs Interclass</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong>
                        <ul>
                            <li><strong>Intraclass:</strong> Similarity <em>within</em> the same group (we want this to be high).</li>
                            <li><strong>Interclass:</strong> Similarity <em>between</em> different groups (we want this to be low).</li>
                        </ul>
                        <strong>Example:</strong> In a school, all "Grade 10" students are in one class. Intraclass similarity means Grade 10 students are similar to each other. Interclass similarity means Grade 10 students are different from Grade 11 students.
                    </div>
                    <div class="visual-box">
                        <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="120" cy="80" rx="80" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="4,3"/>

                            <text x="110" y="50" font-size="10" text-anchor="middle" fill="#1d4ed8">Intraclass (Short)</text>

                            <ellipse cx="280" cy="80" rx="80" ry="60" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
                            <text x="280" y="20" font-size="12" text-anchor="middle" font-weight="bold">Class B</text>
                            <circle cx="260" cy="90" r="5" fill="#15803d"/>

                            <text x="200" y="80" font-size="10" text-anchor="middle" fill="#ef4444">Interclass (Long)</text>
                        </svg>
                    </div>

                    <h2>4. Model</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> The mathematical "brain" created after an algorithm learns from data. It is used to make predictions on new data.
                        <br><br>
                        <strong>Analogy:</strong> You (the algorithm) study past exams (data) and learn the patterns. Your brain after studying is the "model." When a new exam question appears, your brain (model) predicts the answer.
                    </div>

                    <h2>5. Patterns</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> A repeating trend or relationship found in the data.
                        <br><br>
                        <strong>Example:</strong> A supermarket notices that 80% of customers who buy hot dogs also buy hot dog buns. This repeating relationship is a pattern.
                    </div>

                    <h2>6. Class / Concept</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> A category or label we want to predict.
                        <br><br>
                        <strong>Example:</strong> "Spam" and "Not Spam" are two classes. "Pass" and "Fail" are two classes.
                    </div>

                    <h2>7. Normalization (Min-Max Scaling)</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> Squashing all numerical values into a fixed range, usually 0 to 1, so large numbers don't overpower small ones.
                        <br><br>
                        <strong>Example:</strong> If Age goes up to 100 and Salary goes up to 100,000, the algorithm will ignore Age. Normalization scales both to 0-1.
                        <br><br>
                        <strong>Formula:</strong> <code>(Value - Min) / (Max - Min)</code>
                    </div>

                    <h2>8. Standardization (Z-score)</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> Transforming data so the average becomes 0 and the spread (standard deviation) becomes 1. It answers: "How many standard deviations away from the average is this value?"
                        <br><br>
                        <strong>Example:</strong> If the class average is 60 and you scored 80, your Z-score is +2.0, meaning you are 2 standard deviations above average.
                    </div>

                    <h2>9. Anomaly Detection</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> Finding rare items, events, or observations that differ significantly from the majority of the data.
                        <br><br>
                        <strong>Example:</strong> Your credit card usually buys coffee ($5). Suddenly, it buys a TV in another country for $3,000. That is an anomaly.
                    </div>

                    <h2>10. Cluster</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> A group of similar data points discovered by the algorithm (Unsupervised Learning).
                        <br><br>
                        <strong>Example:</strong> Grouping customers into "Budget Shoppers" and "Luxury Shoppers" without being told who belongs where.
                    </div>

                    <h2>11. Encoding</h2>
                    <div class="box">
                        <strong>Simple Definition:</strong> Translating text categories into numbers so a computer can do math on them.
                        <br><br>
                        <strong>Example (One-Hot Encoding):</strong> "Color: Red, Green, Blue" becomes three columns: <code>Is_Red (1/0)</code>, <code>Is_Green (1/0)</code>, <code>Is_Blue (1/0)</code>.
                    </div>

                    <hr style="margin: 40px 0; border: 1px solid #e2e8f0;">

                    <h1>Deep Dive: Data Warehouses</h1>
                    <p>A <strong>Data Warehouse</strong> is a massive, central repository where data from many different sources (like sales, HR, finance) is copied, cleaned, and stored for analysis and reporting.</p>

                    <h2>Where is it found and how is it used?</h2>
                    <div class="box" style="background:#fefce8; border-left-color:#ca8a04;">
                        <ul>
                            <li><strong>Where to find it:</strong> Data Warehouses are not usually on your personal laptop. They are hosted on enterprise servers or cloud platforms like <em>Amazon Redshift, Google BigQuery, Snowflake, or Microsoft Azure Synapse</em>.</li>
                            <li><strong>How it is used:</strong> Businesses use them for <strong>Business Intelligence (BI)</strong>. Instead of slowing down the live sales system with heavy queries, analysts run complex reports (like "Total sales per region over the last 5 years") on the Data Warehouse.</li>
                        </ul>
                    </div>

                    <h2>Data Warehouse vs. Database (Simple Example)</h2>
                    <div class="example-box">
                        <p><strong>The Database (OLTP):</strong> Think of a supermarket cash register. It handles thousands of tiny transactions per second (scan item, take money, update stock). It is fast for single items but bad at calculating "total sales of all apples in the last 5 years."</p>
                        <p><strong>The Data Warehouse (OLAP):</strong> Think of the corporate headquarters. Every night, the register data is copied to the warehouse. The executives use the warehouse to run heavy calculations like "Which region sold the most apples?" without slowing down the cash registers.</p>

        // ===== ADDED: Menu generation + module loading + search + toggle + PDF =====
        document.addEventListener('DOMContentLoaded', () => {
            const menu = document.getElementById('menu');

            // Generate Menu
            Object.keys(modules).forEach(key => {
                const li = document.createElement('li');
                li.textContent = modules[key].title;
                li.id = `menu-item-${key}`;
                li.onclick = () => {
                    loadModule(key);
                    closeSidebar();
                };
                menu.appendChild(li);
            });

            // Load First Module
            loadModule(1);

            // ===== Search functionality =====
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (query.length < 2) {
                    searchResults.classList.remove('show');
                    return;
                }

                const matches = [];
                Object.keys(modules).forEach(key => {
                    const mod = modules[key];
                    const titleMatch = mod.title.toLowerCase().includes(query);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = mod.content;
                    const plainText = tempDiv.textContent || '';
                    const contentMatch = plainText.toLowerCase().includes(query);

                    if (titleMatch || contentMatch) {
                        let snippet = '';
                        if (contentMatch) {
                            const lowerText = plainText.toLowerCase();
                            const idx = lowerText.indexOf(query);
                            const start = Math.max(0, idx - 40);
                            const end = Math.min(plainText.length, idx + 90);
                            snippet = '…' + plainText.slice(start, end).replace(/\s+/g, ' ') + '…';
                        }
                        matches.push({ key, title: mod.title, snippet });
                    }
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = '<div class="no-results">No matches found.</div>';
                } else {
                    searchResults.innerHTML = matches.map(m => `
                        <div class="result-item" onclick="loadModule('${m.key}'); closeSidebar(); clearSearch();">
                            <div class="result-title">${m.title}</div>
                            ${m.snippet ? `<div class="snippet">${m.snippet}</div>` : ''}
                        </div>
                    `).join('');
                }
                searchResults.classList.add('show');
            });

            // Close search dropdown on outside click
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrap')) {
                    searchResults.classList.remove('show');
                }
            });

            // ===== Mobile sidebar toggle =====
            const menuToggle = document.getElementById('menuToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            menuToggle.addEventListener('click', () => {
                document.body.classList.toggle('sidebar-open');
            });
            sidebarOverlay.addEventListener('click', closeSidebar);
        });

        // Load Module Function
        function loadModule(id) {
            const menuItems = document.querySelectorAll('.menu li');
            menuItems.forEach(item => item.classList.remove('active'));
            const active = document.getElementById(`menu-item-${id}`);
            if (active) active.classList.add('active');

            const contentDiv = document.getElementById('content');
            contentDiv.style.opacity = '0';
            setTimeout(() => {
                contentDiv.innerHTML = modules[id].content;
                contentDiv.style.opacity = '1';
                contentDiv.style.transition = 'opacity 0.3s ease';
                contentDiv.dataset.moduleId = id;
            }, 100);

            document.querySelector('.main-content').scrollTop = 0;
            window.scrollTo(0, 0);
        }

        // Copy Code to Clipboard Function
        function copyCode(btn) {
            const pre = btn.parentElement.nextElementSibling;
            const text = pre.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                btn.style.backgroundColor = '#10b981';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.style.backgroundColor = '#3b82f6';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // ===== ADDED: Sidebar close, search clear, PDF download =====
        function closeSidebar() {
            document.body.classList.remove('sidebar-open');
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            const results = document.getElementById('searchResults');
            if (input) input.value = '';
            if (results) results.classList.remove('show');
        }

        // NEW: Function to print the entire note
        function printAll() {
            // Open a new window for printing
            const printWindow = window.open('', '_blank');
            
            // Build the HTML for all modules
            let allContent = `
                <html>
                <head>
                    <title>TECH 307 - Full Interactive Notes</title>
                    <style>
                        body { font-family: "Segoe UI", sans-serif; line-height: 1.6; color: #1e293b; padding: 20px; }
                        h1, h2, h3 { color: #0f172a; }
                        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14px; }
                        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
                        th { background: #f8fafc; }
                        pre { background: #f1f5f9; padding: 10px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; font-family: monospace; }
                        .visual-box { margin: 20px 0; text-align: center; border: 1px dashed #cbd5e1; padding: 10px; }
                        .example-box, .box, .formula-box, .solution-box { border-left: 5px solid #2563eb; background: #eff6ff; padding: 15px; margin: 15px 0; }
                        /* Specific override for amber boxes */
                        .box[style*="border-left-color:#ca8a04"], .example-box[style*="border-left-color:#ca8a04"] { border-left-color: #ca8a04 !important; background: #fefce8 !important; }
                        svg { max-width: 100%; height: auto; }
                        .print-module { page-break-after: always; margin-bottom: 50px; }
                        .diagram-caption { font-size: 13px; color: #64748b; font-style: italic; margin-top: 5px; }
                    </style>
                </head>
                <body>
            `;

            // Loop through all modules and add them
            Object.keys(modules).forEach((key) => {
                allContent += `<div class="print-module">`;
                allContent += `<h1>${modules[key].title}</h1>`;
                allContent += modules[key].content;
                allContent += `</div>`;
            });

            allContent += `</body></html>`;

            // Write the content to the new window
            printWindow.document.write(allContent);
            printWindow.document.close();
            printWindow.focus();

            // Wait a moment for SVG/Images to render, then print
            setTimeout(() => {
                printWindow.print();
            }, 500);
        }

        // UPDATED: Function to download the entire note as PDF
        function downloadPDF() {
            // 1. Build the combined HTML from ALL modules
            let allContent = '';
            Object.keys(modules).forEach((key, index) => {
                // Add a page break before every module except the first
                const pageBreakStyle = index > 0 ? 'page-break-before: always;' : '';
                allContent += `<div class="print-module" style="${pageBreakStyle}">`;
                allContent += `<h1>${modules[key].title}</h1>`;
                allContent += modules[key].content;
                allContent += `</div>`;
            });

            // 2. Create a temporary wrapper to hold the combined content
            const wrapper = document.createElement('div');
            wrapper.style.padding = '20px';
            wrapper.style.fontFamily = 'Georgia, serif';
            wrapper.style.color = '#000';
            wrapper.innerHTML = allContent;

            // 3. Give the user immediate feedback
            const btn = event?.target;
            const originalText = btn?.innerHTML;
            if (btn) {
                btn.innerHTML = 'Generating…';
                btn.disabled = true;
            }

            // 4. Configure and generate the PDF
            const opt = {
                margin:       10,
                filename:     'TECH_307_Full_Notes.pdf',
                image:        { type: 'jpeg', quality: 0.95 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css'] }
            };

            html2pdf().set(opt).from(wrapper).save().then(() => {
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }).catch(err => {
                console.error('PDF generation failed:', err);
                alert('PDF generation failed. Please try the Print button instead.');
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>
